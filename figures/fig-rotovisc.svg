<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif">
  <rect width="520" height="300" fill="#fff"/>
  <!-- 立架＋驅動頭 -->
  <rect x="40" y="30" width="10" height="238" rx="3" fill="#c9ced6" stroke="#52606d" stroke-width="1.4"/>
  <rect x="26" y="266" width="70" height="10" rx="3" fill="#c9ced6" stroke="#52606d" stroke-width="1.4"/>
  <rect x="50" y="36" width="110" height="10" rx="3" fill="#c9ced6" stroke="#52606d" stroke-width="1.2"/>
  <rect x="118" y="44" width="86" height="34" rx="7" fill="#f5f7fa" stroke="#52606d" stroke-width="1.8"/>
  <text x="161" y="65" font-size="10" text-anchor="middle" fill="#52606d" font-weight="600">驅動頭 drive head</text>
  <!-- 主軸＋轉子 -->
  <rect x="158" y="78" width="6" height="119" fill="#8a9099"/>
  <ellipse cx="161" cy="205" rx="26" ry="8" fill="#6b7280" stroke="#4b5563" stroke-width="1.4"/>
  <!-- 液體＋燒杯 -->
  <rect x="112" y="160" width="98" height="78" fill="#3b82c4" opacity="0.75"/>
  <ellipse cx="161" cy="160" rx="49" ry="7" fill="#3b82c4" opacity="0.45"/>
  <path d="M112 118 L112 246 Q112 254 120 254 L202 254 Q210 254 210 246 L210 118" fill="none" stroke="#52606d" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M121 208 a40 15 0 1 0 80 0 a40 15 0 1 0 -80 0" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="10 14" opacity="0.6"/>
  <text x="161" y="276" font-size="11" text-anchor="middle" fill="#52606d">開放式燒杯 open beaker</text>
  <!-- 讀數錶 -->
  <g>
    <circle cx="368" cy="118" r="74" fill="#fff" stroke="#52606d" stroke-width="2"/>
    <line x1="368" y1="118" x2="322" y2="82" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="368" cy="118" r="5" fill="#c0392b"/>
    <text x="368" y="152" font-size="13" text-anchor="middle" fill="#1f2933" font-weight="700">40</text>
    <text x="368" y="170" font-size="10" text-anchor="middle" fill="#52606d">抗力讀數 drag reading</text>
  </g>
  <text x="265" y="292" font-size="11" text-anchor="middle" fill="#52606d">轉子在液體裡轉、機器量抗力——一般流體的粘度這樣量；橡膠黏到轉不動，要用木尼</text>
</svg>
