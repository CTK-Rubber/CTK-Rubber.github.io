<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif">
  <rect width="520" height="300" fill="#fff"/>
  <defs>
    <clipPath id="cupR">
      <!-- 右杯內緣：傾斜 72° 後的世界座標（同互動版算式） -->
      <path d="M462.6 60 L480.2 114.3 L388.9 143.9 L371.3 89.7 Z"/>
    </clipPath>
  </defs>
  <!-- 左杯水：已倒空，盤裡一攤薄水 -->
  <g transform="translate(135 96) rotate(72 31 52)">
    <rect x="-34" y="-56" width="68" height="108" rx="9" fill="none" stroke="#52606d" stroke-width="2.2"/>
    <path d="M30 -56 L46 -48 L33 -40" fill="none" stroke="#52606d" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <path d="M263 126 Q238 190 203 255" fill="none" stroke="#3b82c4" stroke-width="1.8" opacity="0.35" stroke-linecap="round" stroke-dasharray="3 7"/>
  <ellipse cx="203" cy="259" rx="48" ry="3" fill="#3b82c4" opacity="0.75"/>
  <ellipse cx="203" cy="258" rx="26" ry="1.6" fill="#fff" opacity="0.35"/>
  <!-- 右杯蜂蜜：半杯、液面水平（clip 杯內緣）、粗液線、盤裡堆成丘 -->
  <rect x="330" y="102" width="190" height="200" fill="#c98a3d" opacity="0.8" clip-path="url(#cupR)"/>
  <line x1="352" y1="102" x2="470" y2="102" stroke="#fff" stroke-width="1.4" opacity="0.6"/>
  <g transform="translate(355 96) rotate(72 31 52)">
    <rect x="-34" y="-56" width="68" height="108" rx="9" fill="none" stroke="#52606d" stroke-width="2.2"/>
    <path d="M30 -56 L46 -48 L33 -40" fill="none" stroke="#52606d" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <path d="M483 126 Q455 190 423 255" fill="none" stroke="#c98a3d" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="423" cy="253" rx="22" ry="10" fill="#c98a3d" opacity="0.8"/>
  <ellipse cx="423" cy="248" rx="11" ry="5" fill="#c98a3d" opacity="0.55"/>
  <!-- 接盤 -->
  <path d="M147 252 L259 252 L247 268 L159 268 Z" fill="#f5f7fa" stroke="#52606d" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M367 252 L479 252 L467 268 L379 268 Z" fill="#f5f7fa" stroke="#52606d" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="135" y="26" font-size="12.5" text-anchor="middle" fill="#52606d" font-weight="600">水 water</text>
  <text x="355" y="26" font-size="12.5" text-anchor="middle" fill="#52606d" font-weight="600">蜂蜜 honey</text>
  <text x="265" y="292" font-size="11" text-anchor="middle" fill="#52606d">水約 1 秒倒完、攤平；蜂蜜慢慢爬、堆成丘——粘度＝抵抗流動的程度</text>
</svg>
