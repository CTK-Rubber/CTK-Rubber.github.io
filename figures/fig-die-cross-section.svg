<?xml version="1.0" encoding="UTF-8"?>
<!-- 木尼粘度計模穴剖面——依真機工程圖忠實重繪
     結構：上模座（壓簧×2＋測溫孔）→ 上模仁（模穴頂面）
           → 分模線・模穴（齒面轉子盤＋膠樣＋轉子銷）
           → 下模（壓簧＋測溫孔＋銷孔）→ 機台台面
           → 懸吊軸承座（襯套×2＋轉子軸＋尾端螺紋）
     圖面語言：剖面線 45°/反 45°/粗格/X 交叉（襯套）、中心線（點劃線）。 -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 640" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
<defs>
  <pattern id="h45" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#f2f5f8"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#8b98a6" stroke-width="1"/>
  </pattern>
  <pattern id="h45b" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#e9eef3"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8b98a6" stroke-width="0.9"/>
  </pattern>
  <pattern id="hw" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="13" height="13" fill="#eef1f5"/>
    <line x1="0" y1="0" x2="0" y2="13" stroke="#97a3b0" stroke-width="1.3"/>
  </pattern>
  <pattern id="hX" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#f0f3f6"/>
    <path d="M0 0 L9 9 M9 0 L0 9" stroke="#8b98a6" stroke-width="0.8"/>
  </pattern>
</defs>
<rect x="0" y="0" width="700" height="640" fill="#ffffff"/>
<text x="16" y="30" font-size="17" font-weight="700" fill="#1f2933">木尼粘度計——模穴剖面（依真機圖重繪）</text>
<text x="16" y="48" font-size="11.5" fill="#52606d">Mooney viscometer — die assembly cross-section</text>

<!-- ============ 圖面本體（原圖座標 0–430 × 0–600） ============ -->
<g transform="translate(60 18)" stroke-linejoin="round">
  <g stroke="#1f2933" stroke-width="1.3">

    <!-- 中心線（全長點劃線） -->
    <line x1="215" y1="-8" x2="215" y2="582" stroke="#4a5560" stroke-width="0.8" stroke-dasharray="16 4 3 4"/>

    <!-- 上模座：模座體（全寬）＋兩側壁下延至分模線 -->
    <path d="M20,40 L408,40 L408,165 L290,165 L290,112 L160,112 L160,165 L20,165 Z" fill="url(#h45)"/>
    <!-- 上壓簧（左右袋） -->
    <rect x="78" y="52" width="62" height="54" fill="#fdfdfd"/>
    <path d="M84,56 L134,60 L84,68 L134,76 L84,84 L134,92 L84,100" fill="none" stroke-width="1.1"/>
    <path d="M78,52 L140,52 M78,106 L140,106" stroke-width="1.6"/>
    <rect x="300" y="52" width="62" height="54" fill="#fdfdfd"/>
    <path d="M306,56 L356,60 L306,68 L356,76 L306,84 L356,92 L306,100" fill="none" stroke-width="1.1"/>
    <path d="M300,52 L362,52 M300,106 L362,106" stroke-width="1.6"/>
    <!-- 右側小彈簧袋（插銷簧） -->
    <rect x="304" y="86" width="36" height="26" fill="#fdfdfd"/>
    <path d="M308,89 L336,94 L308,99 L336,104" fill="none" stroke-width="1"/>
    <!-- 上測溫孔（左入，盲孔端） -->
    <rect x="22" y="98" width="136" height="11" rx="5.5" fill="#fdfdfd"/>
    <line x1="30" y1="103.5" x2="146" y2="103.5" stroke-width="0.8"/>
    <!-- 上模仁：階梯塊，凸出模穴頂面（反 45° 剖面線） -->
    <path d="M160,48 L290,48 L290,112 L282,112 L282,145 L168,145 L168,112 L160,112 Z" fill="url(#h45b)"/>

    <!-- 膠樣：填滿模穴剩餘空間（轉子盤與銷之上） -->
    <rect x="160" y="145" width="130" height="19" fill="#e9b875" stroke="#b0763a" stroke-width="0.8"/>

    <!-- 齒面轉子盤（不剖，白體＋上下齒紋） -->
    <rect x="178" y="147" width="74" height="13" fill="#ffffff" stroke-width="1.2"/>
    <g stroke="#1f2933" stroke-width="0.9">
      <path d="M181,147 v4 M185,147 v4 M189,147 v4 M193,147 v4 M197,147 v4 M201,147 v4 M205,147 v4 M209,147 v4 M213,147 v4 M217,147 v4 M221,147 v4 M225,147 v4 M229,147 v4 M233,147 v4 M237,147 v4 M241,147 v4 M245,147 v4 M249,147 v4" fill="none"/>
      <path d="M183,156 v4 M187,156 v4 M191,156 v4 M195,156 v4 M199,156 v4 M203,156 v4 M207,156 v4 M211,156 v4 M215,156 v4 M219,156 v4 M223,156 v4 M227,156 v4 M231,156 v4 M235,156 v4 M239,156 v4 M243,156 v4 M247,156 v4 M251,156 v4" fill="none"/>
      <!-- 端面垂直齒紋（真機圓周軸向溝，斷面呈密集直紋） -->
      <path d="M181,148 v10 M184.5,148 v10 M188,148 v10 M191.5,148 v10" fill="none"/>
      <path d="M241,148 v10 M244.5,148 v10 M248,148 v10 M251,148 v10" fill="none"/>
    </g>
    <!-- 轉子銷（盤下短莖，穿過下模銷孔接長軸） -->
    <rect x="205" y="160" width="20" height="55" fill="#ffffff" stroke-width="1.2"/>
    <rect x="200" y="196" width="30" height="9" fill="#ffffff" stroke-width="1.1"/>

    <!-- 下模：模體（45°）＋模仁（銷孔兩側反 45°）＋左壓簧＋下測溫孔 -->
    <path d="M22,165 L408,165 L408,222 L22,222 Z" fill="url(#h45)"/>
    <rect x="150" y="168" width="46" height="50" fill="url(#h45b)"/>
    <rect x="234" y="168" width="56" height="50" fill="url(#h45b)"/>
    <rect x="196" y="168" width="38" height="52" fill="#ffffff"/>
    <rect x="78" y="174" width="62" height="42" fill="#fdfdfd"/>
    <path d="M84,178 L134,182 L84,190 L134,198 L84,206 L134,212" fill="none" stroke-width="1.1"/>
    <path d="M78,174 L140,174 M78,216 L140,216" stroke-width="1.6"/>
    <rect x="24" y="186" width="126" height="11" rx="5.5" fill="#fdfdfd"/>
    <line x1="32" y1="191.5" x2="138" y2="191.5" stroke-width="0.8"/>

    <!-- 機台台面（粗格剖面線） -->
    <rect x="0" y="222" width="430" height="33" fill="url(#hw)" stroke-width="1.5"/>

    <!-- 懸吊軸承座：外壁（45°）＋長孔＋兩段襯套（X 交叉）＋轉子軸＋尾端螺紋 -->
    <path d="M150,255 L285,255 L285,332 L278,332 L278,468 L278,500 L262,540 Q215,578 170,540 L156,500 L156,468 L156,340 L150,340 Z" fill="url(#h45)"/>
    <path d="M172,262 L258,262 L258,540 Q215,566 172,540 Z" fill="#ffffff"/>
    <rect x="172" y="348" width="31" height="44" fill="url(#hX)"/>
    <rect x="228" y="348" width="30" height="44" fill="url(#hX)"/>
    <rect x="172" y="470" width="31" height="52" fill="url(#hX)"/>
    <rect x="228" y="470" width="30" height="52" fill="url(#hX)"/>
    <rect x="205" y="215" width="20" height="337" fill="#ffffff" stroke-width="1.2"/>
    <rect x="202" y="524" width="26" height="28" fill="#ffffff" stroke-width="1.1"/>
    <g stroke="#1f2933" stroke-width="0.9">
      <path d="M204,528 h22 M204,532 h22 M204,536 h22 M204,540 h22 M204,544 h22 M204,548 h22" fill="none"/>
    </g>
    <!-- 軸承座口緣小環（填函壓蓋） -->
    <rect x="168" y="255" width="94" height="8" fill="#e2e7ec" stroke-width="1"/>
  </g>

  <!-- 剖面零件分色提示：膠樣已在繪圖層上色 -->
</g>

<!-- ============ 標註（外層座標） ============ -->
<g font-size="12" fill="#1f2933">
  <text x="505" y="92" font-weight="600">壓簧</text>
  <text x="505" y="106" font-size="10" fill="#52606d">die springs</text>
  <text x="505" y="148" font-weight="600">上模座＋模仁</text>
  <text x="505" y="162" font-size="10" fill="#52606d">upper die + insert</text>
  <text x="505" y="176" font-weight="600">齒面轉子盤</text>
  <text x="505" y="190" font-size="10" fill="#52606d">serrated rotor</text>
  <text x="505" y="212" font-weight="600">膠樣・模穴</text>
  <text x="505" y="226" font-size="10" fill="#52606d">specimen in cavity</text>
  <text x="505" y="260" font-weight="600">下模・分模線</text>
  <text x="505" y="274" font-size="10" fill="#52606d">lower die, parting line</text>
  <text x="505" y="322" font-weight="600">機台台面</text>
  <text x="505" y="336" font-size="10" fill="#52606d">press platen</text>
  <text x="505" y="420" font-weight="600">軸承襯套</text>
  <text x="505" y="434" font-size="10" fill="#52606d">shaft bushings</text>
  <text x="505" y="486" font-weight="600">轉子軸（尾端螺紋接驅動）</text>
  <text x="505" y="500" font-size="10" fill="#52606d">rotor shaft to drive</text>
  <!-- 左欄 -->
  <text x="57" y="120" font-weight="600" text-anchor="end">測溫孔</text>
  <text x="57" y="134" font-size="9" fill="#52606d" text-anchor="end">thermocouple</text>
  <text x="57" y="210" font-weight="600" text-anchor="end">轉子銷</text>
  <text x="57" y="224" font-size="9" fill="#52606d" text-anchor="end">rotor pin</text>
</g>
<g stroke="#7b8b99" stroke-width="0.9" fill="none">
  <polyline points="500,96 415,80 366,80"/>
  <polyline points="500,152 430,128 290,122"/>
  <polyline points="500,172 380,166 256,160"/>
  <polyline points="500,216 400,190 292,166"/>
  <polyline points="500,264 470,214 408,196"/>
  <polyline points="500,326 478,262 436,240"/>
  <polyline points="500,424 400,388 262,378"/>
  <polyline points="500,490 360,466 228,448"/>
  <polyline points="56,124 66,122 98,117"/>
  <polyline points="56,214 130,206 200,200"/>
</g>
<g fill="#7b8b99">
  <circle cx="366" cy="80" r="2.2"/><circle cx="290" cy="122" r="2.2"/>
  <circle cx="256" cy="160" r="2.2"/><circle cx="292" cy="166" r="2.2"/>
  <circle cx="408" cy="196" r="2.2"/><circle cx="436" cy="240" r="2.2"/>
  <circle cx="262" cy="378" r="2.2"/><circle cx="228" cy="448" r="2.2"/>
  <circle cx="98" cy="117" r="2.2"/><circle cx="200" cy="200" r="2.2"/>
</g>
</svg>
