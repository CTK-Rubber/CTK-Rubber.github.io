<div id="root"><div class="flex flex-col gap-6"><header class="inline-hidden flex items-start justify-between gap-4"><div class="flex flex-col gap-1"><h1 class="text-[20px] font-semibold text-text-primary">git 歷程檢視圖（直式＋互動模擬）</h1><p class="text-[14px] text-text-secondary">同一段 git 一生歷程（0 到 24 步）：泳道式檢視，深色主線代表正式版一直都在，彩色分支在上面走。點任一節點看詳細說明與判例。下半部可按按鈕自己走一遍。</p></div><button type="button" tabindex="0" aria-label="Switch to dark mode" id="base-ui-_r_2_" data-base-ui-tooltip-trigger="" data-tooltip-trigger="" class="inline-flex touch-manipulation select-none items-center justify-center outline-none [-webkit-touch-callout:none] disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:shrink-0 shrink-0 focus-ring bg-transparent text-text-secondary hover:bg-tint-secondary hover:text-text-primary data-[pressed]:bg-tint-secondary data-[pressed]:text-text-primary rounded-[6px] size-7 [&amp;_svg]:size-[18px]"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></button></header><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div class="px-[14px] py-5"><div class="flex flex-wrap gap-2 mb-2"><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-secondary text-text-secondary rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">黑線＝正式版（main）</span><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-blue text-blue rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">藍線＝起草版（branch）</span><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-purple text-purple rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">紫線＝越籍上書副本（fork）</span><span class="font-medium first-letter:capitalize inline-flex flex-shrink-0 w-fit items-center justify-center truncate high-contrast:border high-contrast:border-current bg-tint-orange text-orange rounded-[4px] text-12 py-0.5 gap-1 [&amp;_svg]:size-3.5 min-w-5 px-[5px]">虛線＝跨庫或送審</span></div><span class="text-13 font-regular text-secondary block mb-1">圖上只放三層名詞：git 名詞／中文／法律類比；詳細說明與判例點節點才展開。</span><span class="text-13 font-regular text-secondary block">分層標記：你在用（記一筆、起草版、送審、審查、公告施行）；知道即可（撤回、扞格、回滾、拉新進度）；可略過（fork，你對自己檔案庫有寫入權，用不到）。</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div class="px-[14px] py-5"><span class="font-semibold block mb-2">一、git 歷程圖（完整劇本 0 到 24 步）</span><span class="text-13 font-regular block text-secondary mb-3">泳道式檢視：每條泳道是一條連續軌道線，節點長在線上；main 用深色待命的線表示它一直都在，藍色是起草版、紫色是副本。圖頂有節點符號圖例。</span><svg viewBox="0 0 760 1730" class="text-secondary" style="width: 100%; height: auto;"><g><text x="80" y="15" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" class="text-primary">正式版</text><text x="80" y="32" font-size="10" text-anchor="middle" fill="currentColor" class="text-secondary">main</text></g><g><text x="200" y="15" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" class="text-blue">起草版</text><text x="200" y="32" font-size="10" text-anchor="middle" fill="currentColor" class="text-secondary">branch</text></g><g><text x="320" y="15" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor" class="text-purple">副本</text><text x="320" y="32" font-size="10" text-anchor="middle" fill="currentColor" class="text-secondary">fork r text-secondary">git: commit</span></div><span class="text-14 font-regular block mb-1">在副本上記一筆修改痕跡，正式版沒被動到。</span><span class="text-13 font-regular block text-secondary mb-1">初始：現行有效法規彙編</span><span class="text-13 font-regular block text-secondary">實例：020c49a「glossary v2.4.0 法律對譯錨」就是你最近那筆</span></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div class="px-[14px] py-5"><span class="font-semibold block mb-2">三、詞彙補遺（歷程主線之外的 git 用語）</span><span class="text-13 font-regular block text-secondary mb-3">歷程說明檔裡沒走進劇本的詞，一樣法律對譯，知道在哪層即可。</span><table class="w-full text-left text-14"><thead><tr class="text-secondary"><th class="pr-4 pb-1">git 用語</th><th class="pr-4 pb-1">法律對譯</th><th class="pr-4 pb-1">一句話</th><th class="pb-1">層</th></tr></thead><tbody><tr><td class="pr-4 py-1">repo</td><td class="pr-4">檔案庫／法規全典</td><td class="pr-4">被 git 追蹤的資料夾＋全部歷史快照</td><td>你在用</td></tr><tr><td class="pr-4 py-1">init / clone</td><td class="pr-4">設庫／領回全典副本</td><td class="pr-4">平地起新庫／整份複製下來</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">.gitignore</td><td class="pr-4">不入檔清單</td><td class="pr-4">叫 git 別追蹤的檔案清單（大檔、可再生物、密件）</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">checkout / switch</td><td class="pr-4">翻閱某版草案</td><td class="pr-4">把工作副本切到別條線上看</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">stash</td><td class="pr-4">口袋收存</td><td class="pr-4">改到一半先收起來，回來再倒出</td><td>可略過</td></tr><tr><td class="pr-4 py-1">fetch / pull</td><td class="pr-4">調閱／領回併入</td><td class="pr-4">抓新快照看／抓回來合進手上的線</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">reset</td><td class="pr-4">撕頁（危險）</td><td class="pr-4">把線頭硬拉回假裝沒發生，少用</td><td>可略過</td></tr><tr><td class="pr-4 py-1">issue</td><td class="pr-4">請願／陳情單</td><td class="pr-4">掛在庫上的記事追蹤單（跨場待辦）</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">tag / release</td><td class="pr-4">版本標定</td><td class="pr-4">在某個記錄點釘名牌，之後永遠指得到</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">log / blame / diff</td><td class="pr-4">查修訂史／沿革對照</td><td class="pr-4">看誰在什麼時候改了什麼</td><td>你在用</td></tr><tr><td class="pr-4 py-1">reflog</td><td class="pr-4">庫房流水底帳</td><td class="pr-4">線頭移動史，誤刪支線通常能救</td><td>知道即可</td></tr><tr><td class="pr-4 py-1">archive</td><td class="pr-4">封存留檔</td><td class="pr-4">整庫變唯讀博物館，歷史證據還在</td><td>可略過</td></tr><tr><td class="pr-4 py-1">delete</td><td class="pr-4">銷毀全檔</td><td class="pr-4">整庫連歷史消失，不可逆幾乎不用</td><td>可略過</td></tr></tbody></table></div></div><div class="bg-bg-elevated relative border-border-secondary light:bg-clip-padding border overflow-hidden rounded-[10px] mb-4"><div class="px-[14px] py-5"><span class="font-semibold block mb-2">四、想做什麼 → 用哪個（速查）</span><table class="w-full text-left text-14"><tbody><tr><td class="pr-4 py-1">在旁邊試東西不動正本</td><td>開 branch</td></tr><tr><td class="pr-4 py-1">存一個進度點</td><td>commit</td></tr><tr><td class="pr-4 py-1">讓別人看得到進度</td><td>push</td></tr><tr><td class="pr-4 py-1">想把支線成果放進正本</td><td>開 PR → 檢查 → merge</td></tr><tr><td class="pr-4 py-1">發現改壞了要退回</td><td>revert（安全）</td></tr><tr><td class="pr-4 py-1">看誰改了什麼</td><td>git log / blame / diff</td></tr><tr><td class="pr-4 py-1">記一個跨場待辦</td><td>issue</td></tr><tr><td class="pr-4 py-1">標一個里程碑</td><td>tag</td></tr><tr><td class="pr-4 py-1">外人要貢獻</td><td>fork → 對你開 PR</td></tr><tr><td class="pr-4 py-1">專案退役留底</td><td>archive</td></tr></tbody></table></div></div><p class="inline-hidden text-[12px] text-text-secondary">對應表：branch＝起草版、commit＝修訂紀錄點、PR＝待審法案包裹、merge＝公告施行、close＝法案撤回、conflict＝條文扞格、revert＝廢止回滾、fork＝越籍上書副本。詞彙已沉澱進 glossary v2.4.0（PR #69）；補遺與速查對應 git-歷程說明-ct-v2.md 全文。</p></div></div>
